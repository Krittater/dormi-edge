# S2 (แยก admin / ระบบลูกค้า) — ใครเป็นเจ้าของเส้นของทีมงานบน hostname เดิม dormi-api
#   /admin/*  ·  /public/plans  ·  /public/chat-links/*
# ใช้ใน server ของ 10-dormi.conf เท่านั้น (include ที่ระดับ server)
#
#   ก่อน cutover  : dormi_api_pool   (backend เดิมเป็นเจ้าของ — พฤติกรรมเดิมทุกอย่าง)
#   สลับ cutover  : dormi_admin_pool แล้ว  docker exec dormi-edge nginx -t && docker exec dormi-edge nginx -s reload
#   rollback      : (ก่อนเปิด writes เท่านั้น) เปลี่ยนกลับเป็น dormi_api_pool แล้ว reload
#
# ★ ทำตาม runbook ของ dormi-backend-2: docs/runbooks/admin-customer-split-cutover.md (ห้ามสลับเดี่ยว ๆ)
# ★ proxy ตรงไม่ redirect — POST / multipart / cookie ของ hostname เดิมใช้ได้เหมือนเดิม
set $platform_pool dormi_api_pool;
