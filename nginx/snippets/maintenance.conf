# S2 cutover — ปิด writes ระหว่างย้ายข้อมูล (runbook dormi-backend-2: docs/runbooks/admin-customer-split-cutover.md)
# include ที่ระดับ server ของ vhost API (10-dormi / 20-admin-api) — เว็บ (30-web) ไม่มี write ของตัวเอง
#
#   ปกติ           : set $maintenance 0;
#   ปิด writes     : set $maintenance 1;  แล้ว  docker exec dormi-edge nginx -t && docker exec dormi-edge nginx -s reload
#
# ปิด = ทุกคำขอที่ไม่ใช่ GET/HEAD/OPTIONS ตอบ 503 ทุก host · ยกเว้น login/logout ของลูกค้า (เข้าระบบมาอ่านได้ตามที่ประกาศ)
# ★ /admin/auth/* ไม่ยกเว้น: refresh token ของทีมงานอยู่ในตาราง platform ที่กำลังย้าย (export --compare จะจับได้)
set $maintenance 0;

set $maintenance_key "${maintenance}:${request_method}:${uri}";
if ($maintenance_key ~ "^1:(POST|PUT|PATCH|DELETE):(?!/auth/(login|logout)$)") {
    return 503;
}
