# Security headers ของ landing (apex) — ต้อง include ซ้ำในทุก location ที่มี add_header ของตัวเอง
# เพราะ nginx ไม่สืบทอด add_header จาก server ลงมาใน location ที่ประกาศ add_header เอง
# HSTS: ไม่ใส่ includeSubDomains เพราะ apex ครอบ subdomain อื่นที่ไม่ได้อยู่ใน edge นี้ (market. ฯลฯ)
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
