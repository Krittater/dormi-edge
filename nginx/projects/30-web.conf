# ============================================================
# Web frontend (Next.js Node server)  →  dormi-linkandrent.com/app
# ------------------------------------------------------------
# ลอกโครงจาก _web-frontend.conf.example (template) — ไฟล์นี้คือตัวใช้จริง
# server_name = apex อย่างเดียว (www ยังชี้ Render → ใส่แล้ว cert จะ fail ทั้งใบ)
# scale: docker compose up -d --scale dormi-web=N (ไม่ต้องแก้ไฟล์นี้)
# ------------------------------------------------------------
# ★ หน้าแรกของโดเมนเป็นของ "เว็บการตลาด" ที่ market.dormi-linkandrent.com
#   (โฮสต์อยู่บน Vercel คนละที่กับ edge) ส่วนแอปบริหารจัดการอยู่ใต้ /app
#
# ★ ห้ามใส่ market.dormi-linkandrent.com เป็น server_name ที่ไหนก็ตามใน edge
#   scripts/issue-cert.sh ดึงทุก server_name มาออก cert ใบเดียว → โดเมนที่ไม่ได้
#   ชี้มาที่ edge จะทำให้ cert fail ทั้งใบ (เหตุผลเดียวกับที่ www ไม่ถูกใส่)
#
# ★ ฝั่ง Next ต้องตั้ง basePath: "/app" คู่กันเสมอ ไม่งั้นแอปจะคืน HTML ที่ชี้
#   asset ไป /_next/... ซึ่งตกไปโดน location / แล้วเด้งออกไป market → หน้าขาว
#   (ค่านั้นถูกฝังตอน build → เปลี่ยน nginx อย่างเดียวไม่พอ ต้อง build FE ใหม่ด้วย)
# ============================================================

upstream dormi_web_pool {
    zone dormi_web_pool 64k;
    least_conn;
    server dormi-web:3000 resolve;     # service:port ของ frontend Node server
    keepalive 32;
}

# ── :80 — ACME challenge + บังคับไป HTTPS ──
server {
    listen 80;
    server_name dormi-linkandrent.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── :443 — Web frontend ──
server {
    listen 443 ssl;
    http2 on;
    server_name dormi-linkandrent.com;

    ssl_certificate     /etc/letsencrypt/live/edge-dormi/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/edge-dormi/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    # exact match → ชนะ location / เสมอ ไม่โดนเด้งออกไป market
    location = /whoami { return 200 "dormi-web\n"; }

    # /app เปล่าๆ ไม่เข้าเงื่อนไข "^~ /app/" (ไม่มี / ปิดท้าย) ถ้าไม่ดักไว้
    # จะตกไปโดน location / แล้วเด้งออก market ทั้งที่ผู้ใช้ตั้งใจเข้าแอป
    location = /app { return 301 https://dormi-linkandrent.com/app/; }

    # ── แอปบริหารจัดการ ──
    # ★ ^~ ไม่ใช่ prefix ธรรมดา: "/app" แบบธรรมดาจะ match /apple-icon.png ด้วย
    #   (ขึ้นต้นด้วย "app" เหมือนกัน) แล้วส่งเข้า Next เป็น 404
    #   ใช้ ^~ /app/ → ต้องมี / คั่นเท่านั้นถึงจะเข้า
    # ★ proxy_pass ห้ามมี URI ต่อท้าย (ห้ามเป็น http://dormi_web_pool/)
    #   ไม่งั้น nginx จะตัด /app ออกก่อนส่ง แล้ว basePath ของ Next จะไม่ตรงกัน
    location ^~ /app/ {
        include /etc/nginx/snippets/proxy_common.conf;
        proxy_pass http://dormi_web_pool;
    }

    # ── ที่เหลือทั้งหมด → เว็บการตลาด ──
    # รวมลิงก์เก่าที่คนบุ๊กมาร์กไว้ (/login, /apartments/...) — พาไปหน้าแรกของ market
    # ไม่ใช่ 301 แบบเก็บ path เพราะ market เป็นคนละเว็บ ไม่มี path พวกนั้น
    location / { return 301 https://market.dormi-linkandrent.com/; }
}
