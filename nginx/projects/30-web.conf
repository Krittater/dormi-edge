# ============================================================
# Web frontend (Next.js Node server)  →  app.dormi-linkandrent.com
# ------------------------------------------------------------
# ลอกโครงจาก _web-frontend.conf.example (template) — ไฟล์นี้คือตัวใช้จริง
# scale: docker compose up -d --scale dormi-web=N (ไม่ต้องแก้ไฟล์นี้)
# ------------------------------------------------------------
# ★ โดเมนแม่ (dormi-linkandrent.com) ชี้ Vercel แล้ว — เป็นเว็บการตลาด + /admin
#   edge ไม่รับผิดชอบโดเมนแม่อีกต่อไป แอปบริหารจัดการย้ายมาอยู่ที่ app. แทน
#
# ★ ห้ามใส่ dormi-linkandrent.com / market. / www. เป็น server_name ที่ไหนใน edge
#   scripts/issue-cert.sh ดึงทุก server_name มาออก cert ใบเดียว → โดเมนที่ไม่ได้
#   ชี้มาที่ edge จะพิสูจน์สิทธิ์ (ACME http-01) ไม่ผ่าน แล้ว cert fail "ทั้งใบ"
#   รวม app. และ API ทั้งสองตัวด้วย ไม่ใช่แค่โดเมนที่ผิด
#
# ★ location /app/ ยังเก็บไว้ชั่วคราวระหว่างเปลี่ยนผ่าน — ดูเหตุผลตรงบล็อกนั้น
# ============================================================

upstream dormi_web_pool {
    zone dormi_web_pool 64k;
    least_conn;
    server dormi-web:3000 resolve;     # service:port ของ frontend Node server
    keepalive 32;
}

# ── :80 — ACME challenge + บังคับไป HTTPS ──
server {
    listen 80;
    server_name app.dormi-linkandrent.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── :443 — Web frontend ──
server {
    listen 443 ssl;
    http2 on;
    server_name app.dormi-linkandrent.com;

    ssl_certificate     /etc/letsencrypt/live/edge-dormi/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/edge-dormi/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = /whoami { return 200 "dormi-web\n"; }

    # ── ทางเข้าหลัก ──
    # ใช้ได้ก็ต่อเมื่อ FE ถูก build โดย "ไม่มี" basePath แล้วเท่านั้น
    location / {
        include /etc/nginx/snippets/proxy_common.conf;
        proxy_pass http://dormi_web_pool;
    }

    # ── ทางเข้าสำรองระหว่างเปลี่ยนผ่าน (ลบทิ้งได้หลังของนิ่ง) ──
    # ★ ทำไมยังเก็บ: image ของ FE ที่รันอยู่ตอนแก้ไฟล์นี้ยังฝัง basePath "/app" มา
    #   ถ้าเหลือแต่ location / จะได้ 404 ทั้งเว็บจนกว่าจะ build ใหม่เสร็จ
    #   เก็บไว้ = เช็ค cert/routing ได้ทันทีหลัง reload โดยไม่ต้องรอ build
    #   และถ้า deploy รอบใหม่พังจนต้อง revert กลับ image เก่า ก็ยังเข้าทางนี้ได้
    # ★ ^~ ไม่ใช่ prefix ธรรมดา: "/app" เฉยๆ จะ match /apple-icon.png ด้วย
    #   (ขึ้นต้นด้วย "app" เหมือนกัน) แล้วส่งเข้า Next กลายเป็น 404
    # ★ proxy_pass ห้ามมี URI ต่อท้าย ไม่งั้น nginx ตัด /app ออกก่อนส่ง
    location ^~ /app/ {
        include /etc/nginx/snippets/proxy_common.conf;
        proxy_pass http://dormi_web_pool;
    }

    # /app เปล่าๆ (ไม่มี / ปิดท้าย) ไม่เข้าเงื่อนไข ^~ /app/ → เติม / ให้
    # ใช้ $host ไม่ hardcode โดเมน จะได้ไม่ต้องตามแก้ตอนเปลี่ยนชื่ออีก
    location = /app { return 301 https://$host/app/; }
}
