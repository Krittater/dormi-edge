# ============================================================
# Dormi API  →  dormi-api.dormi-linkandrent.com  |  edge = LB ในตัว
# ------------------------------------------------------------
# scale: docker compose up -d --scale dormi-api=N  (ไม่ต้องแก้ไฟล์นี้)
#   → "server ... resolve" ดึง IP ของทุก replica จาก docker DNS อัตโนมัติ
#     แล้วกระจาย load แบบ least_conn ให้เอง
# ------------------------------------------------------------
# [DEPLOY-REMARK] ก่อนขึ้น server จริง:
#   1) DNS: dormi-api.dormi-linkandrent.com → IP ของ edge
#   2) service dormi-api ต้องอยู่บน dormi_network (expose 3000)
#   3) ออก cert: scripts/issue-cert.sh (รวมโดเมนของทุก project อัตโนมัติ)
# ============================================================

upstream dormi_api_pool {
    zone dormi_api_pool 64k;          # ต้องมี zone เพื่อให้ resolve แบบ dynamic ได้
    least_conn;
    server dormi-api:3000 resolve;    # [DEPLOY-REMARK] service:port ภายในของ backend
    keepalive 32;
}

# ── Rate limit: /auth/* (กันยิงถล่ม / bcrypt กิน CPU) ──
# ต่อ IP · ตั้ง "หลวมกว่า" throttle ใน backend (THROTTLE_SENSITIVE = 5/นาที) ตั้งใจ:
#   edge กันแค่ flood ก่อนถึง Node — การกันเดารหัสจริง (ต่อบัญชี/ต่อ IP) เป็นหน้าที่ backend
#   ผู้ใช้จริงหลัง NAT ร่วม (wifi หอพัก) ต้องไม่โดนที่ด่านนี้: login 1 ครั้ง/วินาที ต่อเนื่อง + burst 30
# ไม่ครอบ GET /auth/me, /auth/me/plan, POST /auth/logout (ถูกเรียกทุกหน้า) → ไปที่ location /
# key ว่าง = ไม่นับ: preflight (OPTIONS) ของ CORS ไม่กินโควตา (1 การเรียกจริง = OPTIONS + POST)
map $request_method $auth_rl_key {
    OPTIONS  "";
    default  $binary_remote_addr;
}
limit_req_zone $auth_rl_key zone=api_auth_login:5m rate=60r/m;
limit_req_zone $auth_rl_key zone=api_auth_other:5m rate=30r/m;

# CORS สำหรับ "response ที่ edge สร้างเอง" (429 / 413) เท่านั้น — ไม่ยุ่งกับ response ปกติที่ผ่าน proxy (backend เป็นเจ้าของ)
# ไม่มี header นี้ browser ที่ app. จะอ่าน 429/413 ไม่ได้ (เห็นเป็น CORS/network error) → ผู้ใช้ไม่เห็นข้อความ
# รายการต้องตรงกับ CORS_ORIGIN ของ backend บน prod (.env.production: app. + apex) · origin อื่น = ค่าว่าง = ไม่ส่ง header
map $http_origin $cors_allow_origin {
    default                              "";
    "https://app.dormi-linkandrent.com"  $http_origin;
    "https://dormi-linkandrent.com"      $http_origin;
}
map $cors_allow_origin $cors_allow_credentials {
    default  "true";
    ""       "";
}

# ── :80 — ACME challenge + บังคับไป HTTPS ──
server {
    listen 80;
    server_name dormi-api.dormi-linkandrent.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── :443 — Dormi API ──
server {
    listen 443 ssl;
    http2 on;
    server_name dormi-api.dormi-linkandrent.com;

    ssl_certificate     /etc/letsencrypt/live/edge-dormi/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/edge-dormi/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    limit_req_status 429;
    limit_req_log_level warn;
    limit_req_dry_run on;  # rollout วันแรก: จับ log ไม่บล็อก — ลบออกหลังตรวจ log ครบ 1 วัน

    # response ที่ edge สร้างเอง: 429 (limit_req) และ 413 (เกิน client_max_body_size)
    # ประกาศระดับ server ที่เดียว — error_page ใน location จะ "ทับ" ของ server ทั้งหมด จึงไม่ประกาศใน location
    # (proxy_intercept_errors ปิดอยู่ → 429/413 ที่ backend ตอบเอง ผ่านไปตรง ๆ ไม่ถูกแทน)
    error_page 429 @api_rate_limited;
    error_page 413 @api_too_large;

    location /whoami { return 200 "dormi-api\n"; }

    # ★ ใช้ ~* (ไม่สนตัวพิมพ์) + /? ท้าย: Express (backend) จับ route แบบไม่สนตัวพิมพ์และไม่เข้ม trailing slash
    #   ถ้าใช้ prefix/ตัวพิมพ์ตรงตัว /AUTH/LOGIN หรือ /auth/login/ จะหลุด limit
    # login: bcrypt กิน CPU → โซนแยก เพื่อ flood สมัคร/ลืมรหัสไม่ไปกินโควตา login ของคนอื่น
    location ~* ^/auth/login/?$ {
        limit_req zone=api_auth_login burst=30 nodelay;
        include /etc/nginx/snippets/proxy_common.conf;
        proxy_pass http://dormi_api_pool;
    }

    # สมัคร / ลืมรหัส / ตั้งรหัสใหม่ / เปลี่ยนรหัส / ขอและยืนยันอีเมล
    # ★ เพิ่ม route ใหม่ใต้ /auth ที่เปิดสาธารณะหรือเสี่ยงโดนยิง → ต้องมาเพิ่มในรายการนี้
    location ~* ^/auth/(register|forgot-password|reset-password|change-password|email/verification|email/verify)/?$ {
        limit_req zone=api_auth_other burst=15 nodelay;
        include /etc/nginx/snippets/proxy_common.conf;
        proxy_pass http://dormi_api_pool;
    }

    # ── route อัปโหลดไฟล์ (multipart) — เป็นที่เดียวที่ body ใหญ่กว่า 2m ได้ ──
    # มาจาก FileInterceptor ใน backend (payment-service): ชื่อฟิลด์ 'file' · ไฟล์ละ 1 ไฟล์
    #   POST /apartments/:id/payment-accounts/qr-scan                          สแกน QR บัญชีรับเงิน
    #   POST /apartments/:id/me/payment-slips                                  แนบสลิปของผู้เช่า
    #   POST /apartments/:id/utility-meter-groups/:gid/cycles/:cid/document    เอกสารบิลมิเตอร์รวม
    # เพดานจริงคือ multer ใน backend (FILE_MAX_SIZE_MB, ค่าเริ่มต้น 10 MB — .env.production ไม่ได้ตั้งทับ)
    # ค่า 50m = ของเดิมก่อนมีการจำกัด (คงไว้ไม่ให้ลูกค้าจริงโดน) — ลดเหลือ ~12m ได้เมื่อยืนยัน
    # FILE_MAX_SIZE_MB บน prod แล้ว (10 MB + overhead ของ multipart)
    # ไม่มี route อัปโหลดโลโก้: โลโก้ธนาคารเป็นไฟล์ในเซิร์ฟเวอร์ (BANK_LOGO_DIR) อ่านอย่างเดียว
    location ~* ^/apartments/[^/]+/(payment-accounts/qr-scan|me/payment-slips|utility-meter-groups/[^/]+/cycles/[^/]+/document)/?$ {
        include /etc/nginx/snippets/proxy_common.conf;
        client_max_body_size 50m;
        proxy_pass http://dormi_api_pool;
    }

    location / {
        include /etc/nginx/snippets/proxy_common.conf;
        proxy_pass http://dormi_api_pool;
    }

    # 429 / 413 จาก edge ใช้รูปแบบเดียวกับ backend ({ statusCode, message }) ให้ frontend แสดงข้อความได้
    # + CORS (ACAO/credentials/Vary) เฉพาะ origin ที่อนุญาตตาม map $cors_allow_origin (ค่าว่าง = ไม่ส่ง header)
    #   พอสำหรับ response จริง; ไม่ต้องตอบ preflight เองเพราะ OPTIONS ไม่ถูก limit_req และผ่านไป backend
    #   (เกิน 2m ที่ preflight ไม่เกิด: ไม่มี body)
    # add_header ใน location นี้ทำให้ไม่สืบทอดของ server → ใส่ HSTS/nosniff ซ้ำเอง
    location @api_rate_limited {
        default_type application/json;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Access-Control-Allow-Origin $cors_allow_origin always;
        add_header Access-Control-Allow-Credentials $cors_allow_credentials always;
        add_header Vary "Origin" always;
        add_header Retry-After "30" always;
        return 429 '{"statusCode":429,"message":"ส่งคำขอถี่เกินไป กรุณารอสักครู่แล้วลองใหม่"}';
    }

    location @api_too_large {
        default_type application/json;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Access-Control-Allow-Origin $cors_allow_origin always;
        add_header Access-Control-Allow-Credentials $cors_allow_credentials always;
        add_header Vary "Origin" always;
        return 413 '{"statusCode":413,"message":"ไฟล์หรือข้อมูลที่ส่งมีขนาดใหญ่เกินไป"}';
    }
}
