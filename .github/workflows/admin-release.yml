name: Admin API release (manual)
run-name: Admin API release - ${{ inputs.mode }}
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect server or deploy reviewed backend and Admin APIs
        type: choice
        options: [inspect, deploy]
        default: inspect
permissions:
  contents: read
concurrency:
  group: full-update
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        env:
          RELEASE_MODE: ${{ inputs.mode }}
          EDGE_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.PROD_SERVER }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: RELEASE_MODE,EDGE_SHA
          command_timeout: 40m
          script: |
            set -eu
            cd /root/dormi-edge
            test -z "$(git status --porcelain --untracked-files=no)"
            git fetch origin main
            git merge --ff-only "$EDGE_SHA"
            test "$(git rev-parse HEAD)" = "$EDGE_SHA"
            bash -n deploy/admin-release.sh
            bash deploy/admin-release.sh "$RELEASE_MODE"
