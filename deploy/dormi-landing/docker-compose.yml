# ============================================================
# Landing (Next.js standalone)  →  ให้ edge proxy ที่ dormi-linkandrent.com
# ------------------------------------------------------------
# ใช้ผ่าน deploy/dormi-landing/release.sh เท่านั้น (ส่ง LANDING_IMAGE ให้เอง):
#   docker compose -p dormi-landing -f deploy/dormi-landing/docker-compose.yml ...
# image ถูก build ใน GitHub Actions (release.yml ของ repo landing) แล้วส่งมา docker load
#   → server ไม่ build เอง (next build กิน RAM ~1-1.5GB เสี่ยง OOM ชนกับ postgres)
# ไม่ publish port: edge คุยผ่าน dormi_network ที่ dormi-landing:3000
# ============================================================
services:
  dormi-landing:
    image: ${LANDING_IMAGE:?ต้องส่ง LANDING_IMAGE เช่น dormi-landing:abc1234}
    restart: always
    mem_limit: 384m
    environment:
      # heap เพดาน 256MB ใต้ mem_limit 384m → V8 GC ก่อนที่ kernel จะ OOM-kill ทั้ง container
      NODE_OPTIONS: --max-old-space-size=256
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - dormi_network

networks:
  dormi_network:
    external: true
